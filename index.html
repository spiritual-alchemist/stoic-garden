<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#efe7d8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Garden">
  <title>The Garden</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <main class="app">
    <header class="head">
      <p id="date" class="date"></p>
      <h1 id="question" class="question"></h1>
    </header>

    <canvas id="garden" class="garden" aria-label="Your garden of the four virtues"></canvas>

    <section id="beds" class="beds" aria-label="The four virtues"></section>

    <section id="today" class="today"></section>

    <section id="mirror" class="mirror"></section>

    <section id="echo" class="echo"></section>

    <footer class="foot">
      <p id="epigraph" class="epigraph"></p>
      <div class="menu">
        <button id="export" class="menu-btn">Export</button>
        <button id="import" class="menu-btn">Import</button>
        <button id="reset" class="menu-btn danger">Clear</button>
        <input id="importFile" type="file" accept="application/json" hidden>
      </div>
      <p class="tiny">Your garden lives only on this device. Evidence, not effort — a quiet room, once a day.</p>
    </footer>
  </main>

  <div id="overlay" class="overlay">
    <div class="composer" role="dialog" aria-modal="true">
      <button id="composerClose" class="composer-close" aria-label="Close">×</button>
      <h2 id="composerTitle" class="composer-title"></h2>
      <p id="composerGreek" class="composer-greek"></p>
      <p id="composerPrompt" class="composer-prompt"></p>
      <textarea id="composerNote" class="composer-note" rows="2" placeholder="One line of what happened (optional)"></textarea>
      <button id="composerSave" class="composer-save">Plant it</button>
      <p class="composer-hint">Tapping nothing is allowed. Only log where the virtue actually showed up.</p>
    </div>
  </div>

  <script src="./js/data.js"></script>
  <script src="./js/store.js"></script>
  <script src="./js/garden.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
